<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05030a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f76a9d' d='M16 28C5 20 2 12 6 8c4-4 10-1 10 4 0-5 6-8 10-4 4 4 1 12-10 20z'/%3E%3C/svg%3E" />
    <title>Feliz Cumpleaños — a study in light</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        background: #05030a;
        font-family: "Didot", "Bodoni MT", "Cormorant Garamond", Georgia, "Times New Roman", serif;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* Minimal elegant caption */
      #caption {
        position: fixed;
        left: 50%;
        bottom: calc(6.5vh + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        color: rgba(255, 214, 226, 0.0);
        letter-spacing: 0.42em;
        font-size: clamp(10px, 1.4vw, 15px);
        text-transform: uppercase;
        text-align: center;
        user-select: none;
        pointer-events: none;
        transition: color 3s cubic-bezier(0.19, 0.76, 0.28, 1);
        z-index: 5;
      }
      #caption .rule {
        display: block;
        width: 1px;
        height: 34px;
        margin: 0 auto 14px;
        background: linear-gradient(to bottom, rgba(255, 214, 226, 0), rgba(255, 214, 226, 0.55));
        opacity: 0;
        transition: opacity 2.5s ease;
      }
      #caption.visible {
        color: rgba(255, 214, 226, 0.62);
      }
      #caption.visible .rule {
        opacity: 0.7;
      }
      /* Interaction hint — appears once the heart has fully formed */
      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(20vh + env(safe-area-inset-bottom));
        transform: translateX(-50%) translateY(6px);
        color: rgba(255, 214, 226, 0.55);
        letter-spacing: 0.3em;
        font-size: clamp(9px, 1.1vw, 12px);
        text-transform: uppercase;
        text-align: center;
        white-space: nowrap;
        line-height: 2;
        user-select: none;
        pointer-events: none;
        z-index: 6;
        opacity: 0;
        transition: opacity 2.5s ease, transform 2.5s ease;
      }
      #hint .k {
        display: inline-block;
        border: 1px solid rgba(255, 214, 226, 0.4);
        border-radius: 3px;
        padding: 2px 7px;
        margin: 0 3px;
        font-size: 0.9em;
        letter-spacing: 0.18em;
      }
      #hint.show {
        opacity: 0.8;
        transform: translateX(-50%) translateY(0);
      }
      /* Soft cinematic vignette + grain, purely CSS so the heart stays the focus */
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 4;
        background: radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 48%,
          rgba(0, 0, 0, 0.2) 80%,
          rgba(0, 0, 0, 0.5) 100%
        );
      }
      #grain {
        position: fixed;
        inset: -100%;
        pointer-events: none;
        z-index: 5;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        animation: grain 9s steps(8) infinite;
      }
      @keyframes grain {
        0%,
        100% {
          transform: translate(0, 0);
        }
        12.5% {
          transform: translate(-2%, -3%);
        }
        25% {
          transform: translate(3%, 2%);
        }
        37.5% {
          transform: translate(-3%, 4%);
        }
        50% {
          transform: translate(4%, -2%);
        }
        62.5% {
          transform: translate(-4%, -4%);
        }
        75% {
          transform: translate(2%, 3%);
        }
        87.5% {
          transform: translate(-1%, 2%);
        }
      }
      /* Personal message — the final dedication in the caption's voice, sitting
      exactly where the caption was for continuity */
      #message {
        position: fixed;
        left: 50%;
        bottom: calc(8vh + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        text-align: center;
        opacity: 0;
        pointer-events: none;
        user-select: none;
        z-index: 6;
        width: min(90vw, 720px);
        transition: opacity 3s cubic-bezier(0.19, 0.76, 0.28, 1);
      }
      #message.visible {
        opacity: 1;
      }
      #message .rule {
        display: block;
        width: 1px;
        height: 34px;
        margin: 0 auto 14px;
        background: linear-gradient(to bottom, rgba(255, 214, 226, 0), rgba(255, 214, 226, 0.55));
      }
      #message h1 {
        margin: 0;
        font-family: inherit;
        font-weight: 400;
        text-transform: uppercase;
        font-size: clamp(11px, 1.4vw, 14px);
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: rgba(255, 214, 226, 0.85);
      }
      #message h1 .heart {
        color: #ff7aa8;
        font-size: 0.9em;
      }
      /* Julia's name — the theme's typographic voice, floating above the heart
      in the finale. One name, nothing else. */
      #julia {
        position: fixed;
        left: 50%;
        top: 13%;
        transform: translateX(-50%);
        text-align: center;
        opacity: 0;
        pointer-events: none;
        user-select: none;
        z-index: 6;
        width: min(90vw, 720px);
        transition: opacity 3s cubic-bezier(0.19, 0.76, 0.28, 1);
      }
      #julia.visible {
        opacity: 1;
      }
      #julia .name {
        display: block;
        font-family: inherit;
        font-weight: 400;
        text-transform: uppercase;
        font-size: clamp(14px, 2.2vw, 22px);
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: rgba(255, 255, 255, 0.5);
      }
      #julia .nick svg {
        width: 40px;
        height: 40px;
        display: block;
        margin: 12px auto 0;
        filter: drop-shadow(0 0 12px rgba(255, 150, 180, 0.35));
      }
      /* Touch-to-start overlay — the whole experience begins on the first touch */
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: #05030a;
        z-index: 19;
        cursor: pointer;
        touch-action: none;
        transition: opacity 1.8s cubic-bezier(0.19, 0.76, 0.28, 1);
      }
      #start.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #start .mark {
        color: #ffb6cf;
        font-size: 34px;
        animation: startHeart 2.4s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(255, 120, 170, 0.6));
      }
      @keyframes startHeart {
        0%, 100% { transform: scale(0.82); opacity: 0.65; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      #start .label {
        color: rgba(255, 214, 226, 0.85);
        letter-spacing: 0.34em;
        font-size: clamp(11px, 1.4vw, 14px);
        text-transform: uppercase;
      }
      #start .label::after {
        content: "";
        display: block;
        width: 1px;
        height: 26px;
        margin: 14px auto 0;
        background: linear-gradient(to bottom, rgba(255, 214, 226, 0.6), rgba(255, 214, 226, 0));
      }
      /* Loading / enter badge */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        background: #05030a;
        z-index: 20;
        transition: opacity 1.8s cubic-bezier(0.19, 0.76, 0.28, 1);
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255, 214, 226, 0.35);
        transform: rotate(45deg);
        animation: breathe 3.4s ease-in-out infinite;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot .mark::after {
        content: "";
        width: 12px;
        height: 12px;
        background: rgba(255, 214, 226, 0.9);
        filter: blur(4px);
      }
      @keyframes breathe {
        0%,
        100% {
          transform: rotate(45deg) scale(0.86);
          opacity: 0.6;
        }
        50% {
          transform: rotate(45deg) scale(1);
          opacity: 1;
        }
      }
      #boot .label {
        color: rgba(255, 214, 226, 0.7);
        letter-spacing: 0.34em;
        font-size: 12px;
        text-transform: uppercase;
      }
      #boot .progress {
        width: 120px;
        height: 1px;
        background: rgba(255, 214, 226, 0.14);
        overflow: hidden;
      }
      #boot .progress > i {
        display: block;
        height: 100%;
        width: 30%;
        background: rgba(255, 214, 226, 0.85);
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(430%);
        }
      }
      /* Respect users who prefer reduced motion: skip the animated overlays */
      @media (prefers-reduced-motion: reduce) {
        #grain,
        #boot .mark,
        #boot .progress > i,
        #start .mark {
          animation: none;
        }
        #boot,
        #start {
          transition: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/heartbeat/assets/index-ChiTKrWA.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="caption"><i class="rule"></i><span id="captionText">Feliz Cumpleaños</span></div>
    <div id="message">
      <i class="rule"></i>
      <h1>Happy Birthday <span class="heart">♥</span></h1>
    </div>
    <div id="julia">
      <span class="name">Julia</span>
      <span class="nick">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><path fill="#662113" d="M15.971 15.083c-1.458-2.333-.667-7.708 0-8.958s-.542-2.458-1.5-.458-.996 3-3.162 2.458-1.088-3.292-.379-5.625c.729-2.4-.917-1.959-1.667-.458-.75 1.5-1.254 5.693-2.901 5.984-1.647.291-6.099.599-2.851-5.651C4.818-.139 2.773-.656 1.68 1.459.361 4.007-.404 7.25.221 8.625c1.113 2.448 3.483 2.95 6.983 2.284s6.101-.634 6.101 1.133c0 1.872.208 3.458 1.042 3.625s1.624-.584 1.624-.584zm4.057 0c1.458-2.333.667-7.708 0-8.958s.542-2.458 1.5-.458.996 3 3.162 2.458 1.088-3.292.379-5.625c-.729-2.4.917-1.959 1.667-.458s1.254 5.693 2.901 5.984c1.647.292 6.099.599 2.851-5.651-1.307-2.514.737-3.031 1.831-.916 1.318 2.549 2.084 5.792 1.459 7.167-1.113 2.448-3.482 2.95-6.982 2.284s-6.102-.634-6.102 1.133c0 1.872-.208 3.458-1.041 3.625s-1.625-.585-1.625-.585z"/><path fill="#C1694F" d="M13.859 15.495c.596 2.392.16 4.422-2.231 5.017-2.392.596-6.344.559-7.958-1.303-2.294-2.646-2.531-6.391-1.189-6.725 1.34-.334 10.783.62 11.378 3.011zm8.283 0c-.596 2.392-.16 4.422 2.231 5.017 2.392.596 6.345.559 7.958-1.303 2.295-2.646 2.531-6.391 1.189-6.725-1.34-.334-10.783.62-11.378 3.011z"/><path fill="#272B2B" d="M2.48 12.484c-.943.235-1.102 2.157-.317 4.198l3.374-4.134c-1.457-.146-2.643-.167-3.057-.064zm31.041 0c-.419-.104-1.632-.083-3.118.069l3.445 4.106c.774-2.032.613-3.941-.327-4.175z"/><path fill="#E6AAAA" d="M12.052 15.997c.871 1.393-.553 2.229-1.946 3.099-1.394.871-4.608-.203-5.479-1.596-.871-1.394-1.186-3.131-.676-3.45.51-.318 7.23.553 8.101 1.947zm11.896 0c-.871 1.393.553 2.229 1.945 3.099 1.394.871 4.608-.203 5.479-1.596.871-1.394 1.185-3.131.676-3.45-.51-.318-7.229.553-8.1 1.947z"/><path fill="#C1694F" d="M18 14.125h-.002c-10.271.001-8.703 3.959-7.603 10.541 1.1 6.584 2.401 11.256 7.605 11.256 5.203 0 6.502-4.672 7.604-11.256 1.099-6.582 2.666-10.54-7.604-10.541z"/><path fill="#272B2B" d="M11.826 22.851s-.75-1.299.549-2.049 2.049.549 2.049.549l.75 1.299s.75 1.299-.549 2.049-2.049-.549-2.049-.549l-.75-1.       </span>
    </div>
    <div id="hint"><span class="k">drag</span> to look &nbsp;·&nbsp; <span class="k">scroll</span> to zoom</div>
    <audio id="bgm" src="/heartbeat/audio.mp3" loop preload="auto"></audio>
    <div id="boot">
      <div class="mark"></div>
      <div class="label">Feliz Cumpleaños</div>
      <div class="progress"><i></i></div>
    </div>
    <div id="start">
      <div class="mark">♥</div>
      <div class="label">touch</div>
    </div>
  </body>
